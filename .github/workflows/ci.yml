name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore TouchKeyboard.sln

      - name: Build
        run: dotnet build TouchKeyboard.sln -c Release --no-restore

      - name: Test core
        run: dotnet test tests/TouchKeyboard.Core.Tests/TouchKeyboard.Core.Tests.csproj -c Release

      - name: Test Avalonia frontend
        run: dotnet test tests/TouchKeyboard.Avalonia.Tests/TouchKeyboard.Avalonia.Tests.csproj -c Release

      - name: Hygiene
        if: matrix.os == 'ubuntu-24.04'
        run: bash build/hygiene.sh

      - name: Package smoke (local feed)
        if: matrix.os == 'ubuntu-24.04'
        run: bash build/smoke-pack.sh

      - name: Pack
        if: matrix.os == 'ubuntu-24.04'
        run: |
          dotnet pack src/TouchKeyboard.Core/TouchKeyboard.Core.csproj -c Release -o artifacts
          dotnet pack src/TouchKeyboard.Avalonia/TouchKeyboard.Avalonia.csproj -c Release -o artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
