name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore TouchKeyboard.sln

      - name: Build
        run: dotnet build TouchKeyboard.sln -c Release --no-restore

      - name: Test core
        run: dotnet test tests/TouchKeyboard.Core.Tests/TouchKeyboard.Core.Tests.csproj -c Release

      - name: Test pinyin language pack
        run: dotnet test tests/TouchKeyboard.Ime.Pinyin.Tests/TouchKeyboard.Ime.Pinyin.Tests.csproj -c Release

      - name: Test Avalonia frontend
        run: dotnet test tests/TouchKeyboard.Avalonia.Tests/TouchKeyboard.Avalonia.Tests.csproj -c Release

      - name: Install AOT toolchain
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Hygiene
        if: matrix.os == 'ubuntu-24.04'
        run: bash build/hygiene.sh

      - name: Package smoke (three shapes + AOT)
        if: matrix.os == 'ubuntu-24.04'
        run: bash build/smoke-pack.sh

      - name: Pack
        if: matrix.os == 'ubuntu-24.04'
        run: |
          dotnet pack src/TouchKeyboard.Core/TouchKeyboard.Core.csproj -c Release -o artifacts
          dotnet pack src/TouchKeyboard.Avalonia/TouchKeyboard.Avalonia.csproj -c Release -o artifacts
          dotnet pack src/TouchKeyboard.Ime.Pinyin/TouchKeyboard.Ime.Pinyin.csproj -c Release -o artifacts
          dotnet pack src/TouchKeyboard.Ime.Pinyin.Extended/TouchKeyboard.Ime.Pinyin.Extended.csproj -c Release -o artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  macos:
    name: macos-15
    # macOS runners are available for public repositories; private-repo CI keeps
    # the Ubuntu and Windows jobs. macOS 14 runner images were retired in 2026.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore TouchKeyboard.sln

      - name: Build
        run: dotnet build TouchKeyboard.sln -c Release --no-restore

      - name: Test core
        run: dotnet test tests/TouchKeyboard.Core.Tests/TouchKeyboard.Core.Tests.csproj -c Release

      - name: Test pinyin language pack
        run: dotnet test tests/TouchKeyboard.Ime.Pinyin.Tests/TouchKeyboard.Ime.Pinyin.Tests.csproj -c Release

      - name: Test Avalonia frontend
        run: dotnet test tests/TouchKeyboard.Avalonia.Tests/TouchKeyboard.Avalonia.Tests.csproj -c Release
