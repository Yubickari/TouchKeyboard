version: 1
meta:
  project: TouchKeyboard
  updated: 2026-11-08
exclude: [ "**/node_modules/**", "**/dist/**", "**/bin/**", "**/obj/**", .git/**, "**/.git/**", "**/target/**", "**/vendor/**", "**/__pycache__/**", "**/.venv/**", ".nuget/**", "artifacts/**", ".tmp/**" ]
concepts:
  - id: touchkeyboard.product
    terms: [ 软键盘, 触摸键盘, 虚拟键盘, 内置键盘 ]
    kind: entity
    canonical:
      symbol: TouchKeyboard
      type: library
    note: A touch-first embedded software keyboard for small screens and industrial panels, split into a pure backend core and per-UI frontends.
  - id: keyboard.mode
    terms: [ 键盘模式, 输入模式, 键盘形态 ]
    kind: enum
    canonical:
      symbol: KeyboardMode
      type: enum
    note: "The two top-level surfaces: FullKeyboard (standard US ANSI, no F/numpad/system keys) and NumericKeypad (general or profile-restricted)."
  - id: keyboard.profile
    terms: [ 输入档位, 输入场景, 输入配置, 输入配置档 ]
    kind: entity
    canonical:
      symbol: InputProfile
      type: class
    note: A named input contract that selects validation, default mode, numeric keypad key set, IME capability and commit normalization for one field.
    accepted:
      - symbol: InputProfiles
        path: src/TouchKeyboard.Core/InputProfiles.cs
        reason: Public static factory class shipped in v0.1.0-preview.1; the plural name distinguishes the catalogue of built-in InputProfile instances from the InputProfile type itself.
  - id: keyboard.session
    terms: [ 键盘会话, 编辑会话, 输入会话 ]
    kind: entity
    canonical:
      symbol: KeyboardSession
      type: class
    note: Owns the edit buffer, caret, mode, full-keyboard page, shift state, optional IME composition and commit/cancel lifecycle for one field; closing discards and confirming commits.
  - id: keyboard.state
    terms: [ 键盘状态, 会话状态, 键盘快照 ]
    kind: entity
    canonical:
      symbol: KeyboardState
      type: class
    note: An immutable snapshot of text, caret, mode, full-keyboard page, shift, validation error and optional IME composition that a frontend renders.
  - id: keyboard.layout
    terms: [ 键盘布局, 按键布局, 键位表 ]
    kind: entity
    canonical:
      symbol: KeyboardLayout
      type: class
    note: An immutable keyboard surface described as rows or a grid with column/row spans, rendered by a frontend without UI types in the core.
    accepted:
      - symbol: KeyboardLayouts
        path: src/TouchKeyboard.Core/KeyboardLayouts.cs
        reason: Public static factory class shipped in v0.1.0-preview.1; the plural name marks the builder catalogue that returns KeyboardLayout instances.
  - id: keyboard.key
    terms: [ 按键定义, 键定义, 按键描述 ]
    kind: entity
    canonical:
      symbol: KeyDefinition
      type: class
    note: One key's stable id, primary and shifted labels, optional accessible name, optional KeyGlyph icon, command, unit width, column/row span, style and repeatability.
  - id: keyboard.command
    terms: [ 按键命令, 键命令, 按键动作 ]
    kind: entity
    canonical:
      symbol: KeyCommand
      type: struct
    note: A UI-agnostic action (insert text, backspace, clear, move caret, step digit, toggle sign, toggle shift, switch mode, switch page, toggle IME, submit, close) dispatched by a key.
  - id: keyboard.host
    terms: [ 键盘宿主, 键盘浮层, 键盘面板 ]
    kind: entity
    canonical:
      symbol: TouchKeyboardHost
      type: control
    note: The Avalonia overlay control that renders one session, the field label/unit, the editor surface, the IME candidate bar and the active keyboard layout; it follows the host window's theme variant unless a theme is pinned.
  - id: keyboard.editor_adapter
    terms: [ 编辑适配器, 控件适配器, 编辑器目标 ]
    kind: reference
    canonical:
      symbol: IEditorAdapter
      type: interface
    note: The frontend bridge that reads a target control's text and metadata and commits the validated text back without exposing UI types to the core.
  - id: keyboard.numeric_options
    terms: [ 数字小键盘配置, 小键盘键位, 数字键盘选项 ]
    kind: entity
    canonical:
      symbol: NumericKeypadOptions
      type: class
    note: Which extra keys a numeric profile exposes; NumpadSlots derives the Numpad slots from its step, sign, decimal-point, separator and full-keyboard-switch flags.
  - id: keyboard.validation_error
    terms: [ 输入校验错误, 校验结果, 校验错误码 ]
    kind: entity
    canonical:
      symbol: InputValidationError
      type: class
    note: A culture-neutral error code and arguments returned by profile validation so each frontend can localize the message.
  - id: keyboard.row
    terms: [ 键盘行, 按键行, 键位行 ]
    kind: entity
    canonical:
      symbol: KeyboardRow
      type: class
    note: One horizontal row of KeyDefinition entries; each row scales independently to the available panel width.
  - id: keyboard.command_kind
    terms: [ 按键命令类型, 键命令类型, 命令种类 ]
    kind: enum
    canonical:
      symbol: KeyCommandKind
      type: enum
    note: The closed set of UI-agnostic session actions a key can dispatch, including ToggleIme when an IME engine is configured.
  - id: keyboard.editor_surface
    terms: [ 编辑显示面, 自绘编辑框, 值显示面 ]
    kind: entity
    canonical:
      symbol: TouchKeyboardEditor
      type: control
    note: The Avalonia single-line editor surface that draws text, caret, password mask, horizontal scroll and inline IME composition without being a TextBox.
  - id: keyboard.validation_code
    terms: [ 校验代码, 输入错误代码, 错误码枚举 ]
    kind: enum
    canonical:
      symbol: InputValidationErrorCode
      type: enum
    note: Culture-neutral codes describing why an input profile rejected a value or commit; paired with InputValidationError.
  - id: keyboard.full_layout
    terms: [ 全键盘布局类型, 全键盘形态, 全键盘布局 ]
    kind: enum
    canonical:
      symbol: FullKeyboardLayoutKind
      type: enum
    note: "Selects the full-keyboard geometry: AnsiStyle (strict 15-unit ANSI) or PhoneHybrid (four-row phone-style)."
  - id: keyboard.numeric_layout
    terms: [ 数字键盘布局类型, 数字键盘形态, 通用数字布局 ]
    kind: enum
    canonical:
      symbol: NumericKeypadLayoutKind
      type: enum
    note: "Selects the numeric layout: Numpad (5x4 slot-based, active) or Sequence (retained phone-style, reserved)."
  - id: keyboard.editor_surface_abstraction
    terms: [ 编辑面接口, 编辑面抽象, 可注入编辑面 ]
    kind: reference
    canonical:
      symbol: IEditorSurface
      type: interface
    note: "Frontend-agnostic seam that lets a host inject its own editor surface (default: TouchKeyboardEditor) while the core session remains the source of truth."
  - id: keyboard.key_label
    terms: [ 按键标签, 键帽文案, 键标签 ]
    kind: entity
    canonical:
      symbol: KeyLabel
      type: struct
    note: A key cap label that is either literal text or a localization resource key resolved by the frontend.
  - id: keyboard.key_style
    terms: [ 按键样式, 键样式, 按键风格 ]
    kind: enum
    canonical:
      symbol: KeyStyle
      type: enum
    note: "Visual role of a key: default, action, primary, danger or an empty spacer."
  - id: keyboard.profile_registry
    terms: [ 档位注册表, 输入配置注册表, 输入档位注册表 ]
    kind: entity
    canonical:
      symbol: InputProfileRegistry
      type: class
    note: Case-insensitive registry that resolves built-in and custom InputProfile instances by their stable Id.
  - id: keyboard.layout_view
    terms: [ 键位视图, 布局渲染, 布局视图 ]
    kind: entity
    canonical:
      symbol: KeyboardLayoutView
      type: control
    note: Avalonia control that renders an immutable KeyboardLayout as rows or as a cell grid of TouchKey controls, scaling rows to the available width and applying column/row spans.
  - id: keyboard.touch_key
    terms: [ 触摸按键, 键帽控件, 按键控件 ]
    kind: entity
    canonical:
      symbol: TouchKey
      type: control
    note: Border-based touch key that never takes focus, captures the pointer, supports long-press repeat, draws KeyGlyph vectors and exposes a localized accessible name.
  - id: keyboard.controller
    terms: [ 键盘控制器, 命中控制器, 输入控制器 ]
    kind: entity
    canonical:
      symbol: TouchKeyboardController
      type: class
    note: Window-level pointer controller that resolves a target control, opens the host and restores focus on close.
  - id: keyboard.options
    terms: [ 键盘选项, 宿主配置, 键盘配置 ]
    kind: entity
    canonical:
      symbol: TouchKeyboardOptions
      type: class
    note: Host configuration for theme, key height, layout defaults, physical input, localizer, editor surface injection and the optional IME engine.
  - id: keyboard.theme
    terms: [ 键盘主题, 配色主题, 主题配置 ]
    kind: entity
    canonical:
      symbol: TouchKeyboardTheme
      type: class
    note: Brushes and metrics for the panel, editor, key roles, press feedback, label offset and IME candidate/composition surfaces; light and dark presets ship in the Avalonia frontend.
  - id: keyboard.localizer
    terms: [ 键盘本地化, 文案解析, 本地化器 ]
    kind: reference
    canonical:
      symbol: ITouchKeyboardLocalizer
      type: interface
    note: Resolves named key labels (including IME keys), formats core validation errors and names IME candidates; built-in zh-CN and en-US implementations ship with the Avalonia frontend.
  - id: keyboard.ansi_style
    terms: [ ANSI 风格全键盘, 严格 ANSI, ANSI 布局 ]
    kind: entity
    canonical:
      symbol: AnsiStyle
      type: layout
    note: The strict 15-unit ANSI full keyboard with Tab/Caps reserved spaces and an IME slot that folds into Space when no IME key is present (AnsiStyle Space 7.0); with an engine and IME-capable profile the slot holds the 中/英 toggle and Space returns to 5.5. It keeps exact Enter/Shift/backslash widths and a bottom function row.
  - id: keyboard.phone_hybrid
    terms: [ 手机混合全键盘, 手机全键盘, 手机布局 ]
    kind: entity
    canonical:
      symbol: PhoneHybrid
      type: layout
    note: A four-row phone-style QWERTY full keyboard with symbol and numeric entry points, no number row, and a bottom function row; with no IME key Space expands over the former IME slot (3.5 units), and with an IME key Space returns to 2.5 plus the 中/英 toggle.
  - id: keyboard.numpad
    terms: [ 九宫格, 小键盘, 数字盘 ]
    kind: entity
    canonical:
      symbol: Numpad
      type: layout
    note: The single active 5x4 numeric layout with a left function column, a 3x4 digit block, a right action column and a 1-unit confirm key at the bottom-right.
  - id: keyboard.sequence
    terms: [ 序列布局, 序列键盘, 原手机数字布局 ]
    kind: entity
    canonical:
      symbol: Sequence
      type: layout
    note: The retained phone-style 5x6 numeric surface, renamed from Phone and reserved for a future sequence-entry scenario; not the default.
  - id: keyboard.key_glyph
    terms: [ 按键图标, 键图标, 按键图形 ]
    kind: enum
    canonical:
      symbol: KeyGlyph
      type: enum
    note: A typed semantic icon for function keys (backspace, clear, enter, shift, caret and step arrows, sign toggle, space, password visibility and similar) that each frontend renders with its own vector assets.
  - id: keyboard.symbol_page
    terms: [ 符号页, 常用符号页, 符号键盘页 ]
    kind: entity
    canonical:
      symbol: SymbolPage
      type: layout
    note: A full-keyboard-owned page of common symbols reached from the symbol entry key; the numeric Numpad never opens it.
  - id: keyboard.numpad_slots
    terms: [ 数字盘槽位, 小键盘槽位, 数字键盘槽位 ]
    kind: entity
    canonical:
      symbol: NumpadSlots
      type: class
    note: The scenario mapping for the Numpad's left-row2, right-row2 and bottom-decimal slots, including when 0 or confirm grow into empty cells.
  - id: keyboard.full_keyboard_page
    terms: [ 全键盘页面, 主键盘页, 页面状态 ]
    kind: enum
    canonical:
      symbol: FullKeyboardPage
      type: enum
    note: "Which full-keyboard page is active: Main or Symbols; the symbol page is owned by the full keyboard, not by the numeric Numpad."
  - id: keyboard.grid_layout
    terms: [ 网格布局, 格子布局, 跨行跨列布局 ]
    kind: entity
    canonical:
      symbol: KeyboardGridLayout
      type: class
    note: A fixed columns x rows cell surface where every cell carries a KeyDefinition with ColumnSpan/RowSpan, used by the Numpad so 0 can grow into the empty decimal slot and confirm can grow into an empty right-row2 slot.
  - id: keyboard.grid_cell
    terms: [ 网格单元, 格子, 单元格 ]
    kind: entity
    canonical:
      symbol: KeyboardGridCell
      type: class
    note: "One positioned cell of a KeyboardGridLayout: a zero-based row and column plus the KeyDefinition that occupies that origin."
  - id: keyboard.numpad_slot_key
    terms: [ 数字盘槽位键, 槽位语义键 ]
    kind: enum
    canonical:
      symbol: NumpadSlotKey
      type: enum
    note: "Which semantic key fills a Numpad row-2 side slot: None, the full-keyboard switch (ABC) or the sign toggle."
  - id: keyboard.touch_button
    terms: [ 触摸按钮, 标题栏按钮, 浮层按钮 ]
    kind: entity
    canonical:
      symbol: TouchButton
      type: control
    note: "Touch-first chrome button for the overlay header (close and password reveal): no focus, no hover state, a themed press overlay, a small press scale and an accessible name."
  - id: keyboard.ime_engine
    terms: [ 输入法引擎, 拼音引擎, 语言包引擎, IME 引擎 ]
    kind: reference
    canonical:
      symbol: IImeEngine
      type: interface
    note: The language-pack contract that turns a romanized composition string into ranked candidate text and maps language punctuation, with no UI or platform dependency.
  - id: keyboard.ime_candidate
    terms: [ 候选词, 候选文本, 候选 ]
    kind: entity
    canonical:
      symbol: ImeCandidate
      type: class
    note: "One candidate returned by an IME engine: display text only; ranking and scoring stay inside the engine."
  - id: keyboard.ime_composition
    terms: [ 组合态, 拼音组合, 组合输入, 输入法组合 ]
    kind: entity
    canonical:
      symbol: ImeComposition
      type: class
    note: The core state machine that owns the raw composition string, candidate page and selection while text is composed; it writes to the session buffer only when a candidate or the raw input is committed.
  - id: keyboard.ime_state
    terms: [ 组合态快照, 输入法状态, 候选状态, 候选栏状态 ]
    kind: entity
    canonical:
      symbol: ImeCompositionState
      type: class
    note: An immutable snapshot of IME enablement, composition input, current candidate page and selection that every frontend renders.
  - id: keyboard.ime_options
    terms: [ 输入法选项, IME 配置, 候选栏配置, 输入法配置 ]
    kind: entity
    canonical:
      symbol: TouchKeyboardImeOptions
      type: class
    note: "Host configuration for the optional IME: engine, default enabled state, mode memory, candidate page size, composition length cap and punctuation mapping."
  - id: keyboard.ime_capability
    terms: [ 输入法能力, IME 门控, 档位输入法开关 ]
    kind: entity
    canonical:
      symbol: AllowsIme
      type: property
    note: Whether a profile lets its field use the optional IME; text allows it, while password, ASCII token, numeric and date profiles do not.
  - id: keyboard.pinyin_extended_engine
    terms: [ 扩展词库, 扩展拼音引擎, 专业词库, 文本包 ]
    kind: entity
    canonical:
      symbol: ExtendedPinyinImeEngine
      type: class
    note: The optional extended pinyin engine that reuses the common engine and adds a larger or domain lexicon; installing it is the only change needed to get more vocabulary.
  - id: keyboard.pinyin_engine
    terms: [ 中文拼音引擎, 拼音输入, 常用拼音词库, 拼音语言包 ]
    kind: entity
    canonical:
      symbol: PinyinImeEngine
      type: class
    note: The managed pinyin engine shipped in the optional TouchKeyboard.Ime.Pinyin pack with the common lexicon; it has no native or platform dependency.
